<!DOCTYPE html>
<html lang="tr">
<head>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hava Hokeyi</title>
<style>
:root{--bg:#0e1b2a;--ice:#d9f0ff;--line:#3a7bd5;--me:#ff5a5f;--ai:#ffc107;--txt:#eaf6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b2a;--txt:#eaf6ff}}
:root[data-theme="dark"]{--bg:#0e1b2a;--txt:#eaf6ff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none}
.hud{display:flex;gap:16px;align-items:center;justify-content:center;padding:4px;font-size:20px;font-weight:700}
.hud span{min-width:34px;text-align:center}
.hud small{font-weight:400;opacity:.7;font-size:13px}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;padding:0 4px 4px;box-sizing:border-box}
canvas{width:100%;height:100%;border-radius:12px;box-shadow:0 0 0 3px var(--line)}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1b2acc;gap:14px;text-align:center;padding:20px}
#msg h1{margin:0;font-size:34px}
button{font:inherit;font-weight:700;font-size:18px;padding:12px 26px;border:0;border-radius:30px;background:var(--me);color:#fff}
button.alt{background:#2a4a6b}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="hud"><small>Sen</small><span id="s1">0</span><span>:</span><span id="s2">0</span><small>Rakip</small></div>
<div id="wrap"><canvas id="c" width="480" height="760"></canvas></div>
<div id="msg"><h1>Hava Hokeyi</h1><p>Diskini parmağınla sürükle.<br>İlk 7 golü atan kazanır.<br>İki kişilikte üst yarı Oyuncu 2'nindir.</p>
<div class="row"><button class="alt" onclick="start(0)">Kolay</button><button onclick="start(1)">Orta</button><button class="alt" onclick="start(2)">Zor</button><button onclick="start(3)">2 kişilik</button><button class="alt" onclick="online()">Arkadaşla online</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=480,H=760;const GW=250,PR=50,BR=24,WIN=7;
function fit(){const w=document.getElementById('wrap');H=Math.max(620,Math.min(1100,Math.round(W*w.clientHeight/w.clientWidth)));cv.width=W;cv.height=H}
let puck,me,ai,score,level=1,two=false,role=null,room=null,aiCool=0,running=false,goalFlash=0,msgEl=document.getElementById('msg');
const speeds=[7,10,13];
function reset(dir){
  puck={x:W/2,y:H/2,vx:0,vy:dir*9};
  me={x:W/2,y:H-90,px:W/2,py:H-90};
  ai={x:W/2,y:90,px:W/2,py:90};
}
function start(l){two=l==3;level=two?1:l;score=[0,0];upd();reset(1);running=true;msgEl.style.display='none'}
function upd(){const a=role==='guest'?1:0;document.getElementById('s1').textContent=score[a];document.getElementById('s2').textContent=score[1-a]}
function pos(t){
  const r=cv.getBoundingClientRect();
  return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};
}
function move(e){
  if(!running)return;e.preventDefault();
  for(const t of (e.touches?Array.from(e.touches):[e])){
    const p=pos(t),x=Math.max(PR,Math.min(W-PR,p.x));
    if(role==='guest'){ai.x=W-x;ai.y=H-Math.max(H/2+PR,Math.min(H-PR,p.y));sendPos();continue}
    if(two&&role!=='host'&&p.y<H/2){ai.x=x;ai.y=Math.max(PR,Math.min(H/2-PR,p.y))}
    else{me.x=x;me.y=Math.max(H/2+PR,Math.min(H-PR,p.y))}
  }
}
cv.addEventListener('mousemove',move);
cv.addEventListener('touchstart',move,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
function hit(p,vx,vy){
  const dx=puck.x-p.x,dy=puck.y-p.y,d=Math.hypot(dx,dy),m=PR+BR;
  if(d<m&&d>0){
    const nx=dx/d,ny=dy/d;
    puck.x=p.x+nx*m;puck.y=p.y+ny*m;
    const rel=(puck.vx-vx)*nx+(puck.vy-vy)*ny;
    if(rel<0){puck.vx-=2*rel*nx;puck.vy-=2*rel*ny}
    puck.vx+=vx*1.0;puck.vy+=vy*1.0;
    const s=Math.hypot(puck.vx,puck.vy),mx=27;if(s>0&&s<8){puck.vx*=8/s;puck.vy*=8/s}
    if(s>mx){puck.vx*=mx/s;puck.vy*=mx/s}
  }
}
function goal(who){
  score[who]++;upd();goalFlash=30;
  if(score[who]>=WIN){
    running=false;if(role==='host')sendEnd(who);
    msgEl.innerHTML='<h1>'+(role==='host'?(who==0?'Kazandın! 🏆':'Arkadaşın kazandı'):(two?'Oyuncu '+(who+1)+' kazandı! 🏆':(who==0?'Kazandın! 🏆':'Rakip kazandı')))+'</h1><p>'+score[0]+' - '+score[1]+'</p><button onclick="msgEl.style.display=\'none\';again()">Tekrar oyna</button><button class="alt" onclick="location.reload()">Seviye seç</button>';
    msgEl.style.display='flex';
  } else reset(who==0?-1:1);
}
function step(){
  if(!running||role==='guest')return;
  const vx=me.x-me.px,vy=me.y-me.py;me.px=me.x;me.py=me.y;if(role==='host')remoteIn();
  let avx=0,avy=0;
  if(two){avx=ai.x-ai.px;avy=ai.y-ai.py;ai.px=ai.x;ai.py=ai.y}else{
  const sp=speeds[level];
  let tx=W/2,ty=70;
  if(puck.y<H/2+20){tx=puck.x;ty=puck.y<ai.y?Math.max(70,puck.y-40):Math.min(H/2-PR,puck.y-PR-8)}
  if(puck.y<H/2&&puck.y>ai.y&&Math.abs(puck.x-ai.x)<PR+BR){ty=puck.y-10}
  if(!two){
    const wall=puck.x<PR+BR+16||puck.x>W-PR-BR-16;
    if(aiCool>0){aiCool--;tx=W/2;ty=Math.max(70,ai.y-80)}
    else if(wall&&Math.hypot(puck.x-ai.x,puck.y-ai.y)<PR+BR+4)aiCool=20;
  }
  const ax=tx-ai.x,ay=ty-ai.y,ad=Math.hypot(ax,ay);
  if(ad>1){const k=Math.min(sp,ad);avx=ax/ad*k;avy=ay/ad*k}
  ai.x=Math.max(PR,Math.min(W-PR,ai.x+avx));
  ai.y=Math.max(PR,Math.min(H/2-PR,ai.y+avy));}
  // puck
  puck.x+=puck.vx;puck.y+=puck.vy;
  puck.vx*=.9990;puck.vy*=.9990;
  if(puck.x<BR){puck.x=BR;puck.vx=Math.abs(puck.vx)}
  if(puck.x>W-BR){puck.x=W-BR;puck.vx=-Math.abs(puck.vx)}
  const inGoal=Math.abs(puck.x-W/2)<GW/2-BR/2;
  if(puck.y<BR){ if(inGoal&&puck.y<0){goal(0);return} if(!inGoal){puck.y=BR;puck.vy=Math.abs(puck.vy)} }
  if(puck.y>H-BR){ if(inGoal&&puck.y>H){goal(1);return} if(!inGoal){puck.y=H-BR;puck.vy=-Math.abs(puck.vy)} }
  hit(me,vx,vy);hit(ai,avx,avy);
  if(Math.abs(puck.vx)+Math.abs(puck.vy)<2){puck.vy+=puck.y<H/2?.8:-.8;puck.vx+=puck.x<W/2?.4:-.4}
}
function disc(x,y,r,c){
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill();
  ctx.beginPath();ctx.arc(x,y,r*.55,0,7);ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.stroke();
}
function draw(){
  if(role==='guest'){ctx.save();ctx.translate(W,H);ctx.rotate(Math.PI)}
  ctx.fillStyle='#dff3ff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#3a7bd5';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,60,0,7);ctx.stroke();
  ctx.fillStyle='#3a7bd5';
  ctx.fillRect((W-GW)/2,0,GW,8);ctx.fillRect((W-GW)/2,H-8,GW,8);
  if(goalFlash>0){ctx.fillStyle='rgba(255,255,255,'+goalFlash/45+')';ctx.fillRect(0,0,W,H);goalFlash--}
  if(puck){const g=role==='guest';disc(ai.x,ai.y,PR,g?'#ff5a5f':'#ffc107');disc(me.x,me.y,PR,g?'#ffc107':'#ff5a5f');
    ctx.beginPath();ctx.arc(puck.x,puck.y,BR,0,7);ctx.fillStyle='#1a1a1a';ctx.fill()}
  if(role==='guest')ctx.restore();
}
function loop(){step();draw();requestAnimationFrame(loop)}
fit();reset(1);loop();
</script>
<script>
let started=false,fr=0;
function say(h){msgEl.innerHTML=h;msgEl.style.display='flex'}
function sendPos(){if(room)room.presence({x:Math.round(ai.x),y:Math.round(ai.y)})}
function sendEnd(w){const d={w:w,s:[score[0],score[1]]};room.emit('end',d);setTimeout(()=>room&&room.emit('end',d),400);setTimeout(()=>room&&room.emit('end',d),1200)}
function remoteIn(){
  const g=room.peers().find(p=>!p.isMe&&p.presence&&p.presence.x!=null);
  if(g){ai.x=Math.max(PR,Math.min(W-PR,Number(g.presence.x)||W/2));ai.y=Math.max(PR,Math.min(H/2-PR,Number(g.presence.y)||PR))}
  if((fr++&1)==0)room.emit('st',{p:[Math.round(puck.x),Math.round(puck.y)],m:[Math.round(me.x),Math.round(me.y)],s:score});
}
function layout(){
  const w=document.getElementById('wrap'),k=Math.min(w.clientWidth/W,w.clientHeight/H);
  cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px';
}
addEventListener('resize',()=>{if(role)layout()});
function setSize(){W=480;H=800;cv.width=W;cv.height=H;layout()}
function online(){
  say('<h1>Arkadaşla online</h1><p>İkiniz de aynı linki açın.<br>Biri oda kursun, diğeri kodu girsin.</p><div class="row"><button onclick="createRoom()">Oda kur</button><button class="alt" onclick="joinUI()">Odaya katıl</button></div><button class="alt" onclick="location.reload()">Geri</button>');
}
function getRoom(code,host){
  return new Promise(resolve=>{
    let done=false;
    const fail=()=>{if(done)return;done=true;say('<h1>Bağlanılamadı</h1><p>Kod yanlış olabilir ya da internet bağlantısı engelliyor.<br>Tekrar dene.</p><button onclick="location.reload()">Geri</button>');resolve(null)};
    if(typeof Peer==='undefined'){fail();return}
    const hs={},cbs=[],self={isMe:true,presence:{}},remote={isMe:false,presence:{}};
    let conn=null;
    const R={
      peers:()=>conn&&conn.open?[self,remote]:[self],
      onPeers:f=>{cbs.push(f)},
      presence:v=>{if(conn&&conn.open)conn.send({t:'p',v:v})},
      emit:(k,d)=>{if(conn&&conn.open)conn.send({t:'e',k:k,d:d})},
      on:(k,f)=>{(hs[k]=hs[k]||[]).push(f)}
    };
    function attach(c){
      conn=c;
      c.on('data',m=>{
        if(!m)return;
        if(m.t==='p')remote.presence=m.v||{};
        else if(m.t==='e')(hs[m.k]||[]).forEach(f=>f({isMe:false,data:m.d}));
      });
      c.on('close',()=>{running=false;say('<h1>Bağlantı koptu</h1><button onclick="location.reload()">Ana menü</button>')});
    }
    const timer=setTimeout(fail,15000);
    const ok=()=>{if(done)return;done=true;clearTimeout(timer);resolve(R)};
    if(host){
      const p=new Peer('hh-'+code);
      p.on('error',fail);
      p.on('open',ok);
      p.on('connection',c=>{
        if(conn&&conn.open){c.close();return}
        c.on('open',()=>{attach(c);const ch={peers:R.peers()};cbs.forEach(f=>f(ch))});
      });
    }else{
      const p=new Peer();
      p.on('error',fail);
      p.on('open',()=>{
        const c=p.connect('hh-'+code,{serialization:'json'});
        c.on('open',()=>{attach(c);ok()});
      });
    }
  });
}
async function createRoom(){
  const code=Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join('');
  room=await getRoom(code,true);if(!room)return;
  role='host';started=false;
  say('<h1>Oda kodu</h1><h1 style="letter-spacing:8px">'+code.toUpperCase()+'</h1><p>Arkadaşın “Odaya katıl” deyip bu kodu girsin.<br>Bekleniyor…</p>');
  room.onPeers(c=>{if(role==='host'&&!started&&c.peers.some(p=>!p.isMe)){started=true;hostGo()}});
}
function hostGo(){
  setSize();two=true;score=[0,0];upd();reset(1);running=true;msgEl.style.display='none';
}
function again(){if(role==='host')hostGo();else start(two?3:level)}
function joinUI(){
  say('<h1>Oda kodu</h1><input id="cd" maxlength="4" autocapitalize="characters" style="font-size:30px;width:150px;text-align:center;border-radius:12px;border:0;padding:8px"><button onclick="joinRoom()">Katıl</button>');
}
async function joinRoom(){
  const code=document.getElementById('cd').value.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(code))return;
  room=await getRoom(code);if(!room)return;
  role='guest';two=true;setSize();score=[0,0];reset(1);upd();
  say('<h1>Bağlandı</h1><p>Oda sahibi bekleniyor…</p>');
  room.on('st',onSt);room.on('end',onEnd);
}
function onSt(m){
  if(m.isMe||!m.data)return;
  const d=m.data;
  if(!Array.isArray(d.p)||!Array.isArray(d.m)||!Array.isArray(d.s))return;
  if(!running){running=true;msgEl.style.display='none'}
  puck.x=Number(d.p[0])||0;puck.y=Number(d.p[1])||0;me.x=Number(d.m[0])||0;me.y=Number(d.m[1])||0;
  const s=[Number(d.s[0])||0,Number(d.s[1])||0];
  if(s[0]+s[1]>score[0]+score[1])goalFlash=30;
  score=s;upd();
}
function onEnd(m){
  if(m.isMe||!m.data||!Array.isArray(m.data.s))return;
  running=false;score=[Number(m.data.s[0])||0,Number(m.data.s[1])||0];upd();
  const win=m.data.w===1;
  say('<h1>'+(win?'Kazandın! 🏆':'Arkadaşın kazandı')+'</h1><p>'+score[1]+' - '+score[0]+'</p><p>Oda sahibi yeniden başlatınca oyun devam eder.</p>');
}
</script>
</body>
</html>
